<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caja Detox</title>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg: #0f1419; --card: #1a2129; --borde: #2a333d; --texto: #e6edf3;
    --sub: #8b98a5; --ok: #3fd97f; --off: #4a5560; --acento: #6c8cff;
    --alerta: #ff6b6b; --aviso: #f5c451;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 400px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--sub); font-size: .85rem; margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--borde);
    border-radius: 14px; padding: 20px; margin-bottom: 16px;
  }
  label { display: block; font-size: .8rem; color: var(--sub); margin: 12px 0 4px; }
  input {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--borde);
    background: var(--bg); color: var(--texto); font-size: 1rem;
  }
  button {
    width: 100%; padding: 12px; border: 0; border-radius: 8px; font-size: 1rem;
    font-weight: 600; cursor: pointer; margin-top: 16px;
  }
  button:disabled { opacity: .4; cursor: default; }
  .primario { background: var(--acento); color: #fff; }
  .iniciar { background: var(--ok); color: #062b14; }
  .terminar { background: transparent; color: var(--alerta); border: 1px solid var(--alerta); }
  .secundario { background: transparent; color: var(--sub); border: 1px solid var(--borde); }

  .estado-con { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--sub); }
  .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--off); }
  .punto.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

  .caja { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
  .icono {
    width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center;
    font-size: 2rem; background: var(--bg); border: 2px solid var(--borde); flex-shrink: 0;
  }
  .icono.guardado { border-color: var(--ok); }
  .icono.afuera { border-color: var(--off); opacity: .7; }
  .caja-txt strong { display: block; font-size: 1.1rem; }
  .caja-txt span { color: var(--sub); font-size: .85rem; }

  .chip {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .75rem;
    font-weight: 700; letter-spacing: .04em; margin-top: 6px;
  }
  .chip.LIBRE { background: #26303a; color: var(--sub); }
  .chip.DETOX { background: #12331f; color: var(--ok); }
  .chip.ALERTA { background: #3a1717; color: var(--alerta); }

  .reloj {
    font-size: 3rem; font-weight: 700; text-align: center; margin: 18px 0 4px;
    font-variant-numeric: tabular-nums;
  }
  .reloj-sub { text-align: center; color: var(--sub); font-size: .85rem; }
  .barra { height: 6px; background: var(--bg); border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .barra div { height: 100%; width: 0; background: var(--ok); transition: width .5s; }

  .minutos { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .minutos button {
    flex: 1; margin: 0; padding: 10px 0; background: var(--bg); color: var(--texto);
    border: 1px solid var(--borde); font-weight: 600; min-width: 60px;
  }
  .minutos button.sel { border-color: var(--ok); color: var(--ok); }

  .aviso {
    padding: 12px 14px; border-radius: 10px; font-size: .9rem; margin-bottom: 16px;
    border: 1px solid; display: none;
  }
  .aviso.alerta { display: block; background: #3a1717; border-color: var(--alerta); color: #ffc9c9; }
  .aviso.info { display: block; background: #12331f; border-color: var(--ok); color: #bff3d3; }
  .aviso.warn { display: block; background: #3a3015; border-color: var(--aviso); color: #fbe7b0; }

  #log {
    font-family: ui-monospace, Consolas, monospace; font-size: .75rem; color: var(--sub);
    max-height: 120px; overflow-y: auto; white-space: pre-wrap; margin: 0;
  }
  .error-msg { color: var(--alerta); font-size: .85rem; margin-top: 10px; min-height: 1em; }
  .oculto { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>📦 Caja Detox</h1>
  <p class="sub">Contra la tecnoadicción · MQTT sobre TLS</p>

  <!-- Login -->
  <section id="login" class="card">
    <div class="estado-con"><span class="punto"></span> Desconectado</div>
    <label for="usuario">Usuario</label>
    <input id="usuario" value="app_agustin" autocomplete="username">
    <label for="clave">Contraseña</label>
    <input id="clave" type="password" autocomplete="current-password">
    <button id="btnConectar" class="primario">Conectar</button>
    <div id="errorLogin" class="error-msg"></div>
  </section>

  <!-- Panel -->
  <section id="panel" class="oculto">
    <div id="aviso" class="aviso"></div>

    <div class="card">
      <div class="estado-con"><span id="puntoCon" class="punto ok"></span> <span id="txtCon">Conectado al broker (TLS)</span></div>
      <div class="caja">
        <div id="icono" class="icono afuera">📱</div>
        <div class="caja-txt">
          <strong id="txtCelu">Esperando a la caja…</strong>
          <span id="txtSalidas">&nbsp;</span><br>
          <span id="chipModo" class="chip LIBRE">LIBRE</span>
        </div>
      </div>

      <div id="txtWifi" class="reloj-sub" style="text-align:left; margin-top:12px">&nbsp;</div>

      <div id="zonaReloj" class="oculto">
        <div id="reloj" class="reloj">00:00</div>
        <div class="reloj-sub">tiempo restante sin celular</div>
        <div class="barra"><div id="barra"></div></div>
      </div>
    </div>

    <div class="card">
      <div id="zonaIniciar">
        <div class="estado-con">Duración del modo detox</div>
        <div class="minutos" id="minutos">
          <button data-min="1">1 min</button>
          <button data-min="15">15</button>
          <button data-min="30" class="sel">30</button>
          <button data-min="60">60</button>
        </div>
        <button id="btnIniciar" class="iniciar" disabled>Iniciar detox</button>
        <div id="ayudaIniciar" class="reloj-sub" style="margin-top:8px">Guardá el celu en la caja para habilitar</div>
      </div>
      <button id="btnTerminar" class="terminar oculto">Terminar detox</button>
    </div>

    <div class="card">
      <div class="estado-con">Buzzer de la caja</div>
      <button id="btnBuzzer" class="secundario">🔔 Hacer sonar (3 s)</button>
    </div>

    <div class="card">
      <div class="estado-con">Análisis de la conexión</div>
      <button id="btnLatencia" class="secundario">Medir latencia (5 pruebas)</button>
      <div id="txtLatencia" class="reloj-sub" style="margin-top:10px">&nbsp;</div>
    </div>

    <div class="card"><pre id="log"></pre></div>
    <button id="btnSalir" class="secundario">Desconectar</button>
  </section>
</main>

<script>
  // ---- Configuración del broker (estos datos NO son secretos) ----
  const BROKER = "wss://z5bfcca9.ala.us-east-1.emqxsl.com:8084/mqtt";
  const TOPICO_CMD    = "casa/caja/cmd";      // la app manda órdenes acá
  const TOPICO_ESTADO = "casa/caja/estado";   // la placa informa acá

  let cliente = null;
  let estado = null;          // último estado recibido de la placa
  let restanteLocal = 0;      // segundos, para que el reloj corra entre reportes
  let minutosElegidos = 30;
  const $ = id => document.getElementById(id);

  const EVENTOS = {
    SACARON_CELU:      ["alerta", "⚠️ ¡Sacaron el celu de la caja! El detox está en pausa hasta que vuelva."],
    CELU_DEVUELTO:     ["info",   "📦 El celu volvió a la caja. El detox sigue."],
    OBJETIVO_CUMPLIDO: ["info",   "🎉 ¡Objetivo cumplido! Terminó el tiempo sin celular."],
    NO_HAY_CELU:       ["warn",   "Primero guardá el celu en la caja: el sensor tiene que detectarlo."],
    DETOX_INICIADO:    ["info",   "Detox iniciado. ¡A desconectarse!"],
    DETOX_CANCELADO:   ["warn",   "Detox terminado antes de tiempo."],
    BUZZER:            ["info",   "🔔 La caja está sonando (3 s)."],
  };

  function log(msg) {
    const hora = new Date().toLocaleTimeString();
    $("log").textContent = `[${hora}] ${msg}\n` + $("log").textContent;
  }

  function mostrarAviso(tipo, texto) {
    const a = $("aviso");
    a.className = "aviso " + tipo;
    a.textContent = texto;
  }

  function fmt(seg) {
    seg = Math.max(0, Math.round(seg));
    const m = Math.floor(seg / 60), s = seg % 60;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function calidad(rssi) {
    if (rssi >= -60) return "muy buena";
    if (rssi >= -70) return "buena";
    if (rssi >= -80) return "regular";
    return "débil";
  }

  function pintar() {
    if (!estado) return;
    if (typeof estado.rssi === "number") {
      $("txtWifi").textContent = `WiFi de la caja: canal ${estado.canal ?? "?"} · señal ${estado.rssi} dBm (${calidad(estado.rssi)})`;
    }
    const guardado = estado.celu === "GUARDADO";
    $("icono").className = "icono " + (guardado ? "guardado" : "afuera");
    $("txtCelu").textContent = guardado ? "Celular guardado en la caja" : "Celular fuera de la caja";
    $("chipModo").className = "chip " + estado.modo;
    $("chipModo").textContent = estado.modo;

    const enDetox = estado.modo !== "LIBRE";
    $("txtSalidas").textContent = enDetox ? `Veces que lo sacaron: ${estado.salidas}` : " ";
    $("zonaReloj").classList.toggle("oculto", !enDetox);
    $("zonaIniciar").classList.toggle("oculto", enDetox);
    $("btnTerminar").classList.toggle("oculto", !enDetox);
    $("btnIniciar").disabled = !guardado;
    $("ayudaIniciar").textContent = guardado ? " " : "Guardá el celu en la caja para habilitar";

    $("reloj").textContent = fmt(restanteLocal);
    const pct = estado.meta ? (1 - restanteLocal / estado.meta) * 100 : 0;
    $("barra").style.width = Math.min(100, Math.max(0, pct)) + "%";
    $("barra").style.background = estado.modo === "ALERTA" ? "var(--alerta)" : "var(--ok)";
  }

  // El reloj baja de a un segundo entre reportes (solo si el detox está corriendo)
  setInterval(() => {
    if (estado && estado.modo === "DETOX" && restanteLocal > 0) {
      restanteLocal--;
      pintar();
    }
  }, 1000);

  $("minutos").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    minutosElegidos = Number(b.dataset.min);
    document.querySelectorAll("#minutos button").forEach(x => x.classList.toggle("sel", x === b));
  });

  $("btnConectar").onclick = () => {
    const usuario = $("usuario").value.trim();
    const clave = $("clave").value;
    if (!usuario || !clave) { $("errorLogin").textContent = "Completá usuario y contraseña."; return; }

    $("btnConectar").disabled = true;
    $("errorLogin").textContent = "";

    // La contraseña solo vive en memoria mientras dura la conexión.
    cliente = mqtt.connect(BROKER, {
      username: usuario,
      password: clave,
      clientId: "app_" + Math.random().toString(16).slice(2, 10),
      clean: true,
      reconnectPeriod: 3000,
      connectTimeout: 8000,
    });
    $("clave").value = "";

    cliente.on("connect", () => {
      $("login").classList.add("oculto");
      $("panel").classList.remove("oculto");
      $("puntoCon").className = "punto ok";
      $("txtCon").textContent = "Conectado al broker (TLS)";
      log("Conectado de forma segura al broker");
      cliente.subscribe(TOPICO_ESTADO, { qos: 1 }, err => {
        log(err ? "Error al suscribirse: " + err.message : "Escuchando la caja");
      });
    });

    cliente.on("message", (topico, payload, paquete) => {
      if (topico !== TOPICO_ESTADO) return;
      let datos;
      try { datos = JSON.parse(payload.toString()); }
      catch { log("Mensaje inválido ignorado"); return; }
      if (datos.evento === "PONG" && !paquete.retain) {
        const t0 = pings.get(datos.ping);
        if (t0 !== undefined) {
          pings.delete(datos.ping);
          const rtt = Math.round(performance.now() - t0);
          tiempos.push(rtt);
          log(`Latencia ida y vuelta: ${rtt} ms`);
          mostrarLatencia();
        }
      }
      estado = datos;
      restanteLocal = Number(datos.restante) || 0;
      // Los eventos se muestran solo si llegan en vivo (no el mensaje guardado del broker)
      if (datos.evento && !paquete.retain && EVENTOS[datos.evento]) {
        const [tipo, texto] = EVENTOS[datos.evento];
        mostrarAviso(tipo, texto);
        log(texto);
        if (navigator.vibrate && tipo === "alerta") navigator.vibrate([300, 150, 300]);
      }
      pintar();
    });

    cliente.on("reconnect", () => {
      $("puntoCon").className = "punto";
      $("txtCon").textContent = "Reconectando…";
    });

    cliente.on("error", err => {
      log("Error: " + err.message);
      if (!$("panel").classList.contains("oculto")) return;
      $("errorLogin").textContent = "No se pudo conectar: revisá usuario y contraseña.";
      $("btnConectar").disabled = false;
      cliente.end(true);
    });
  };

  function enviar(cmd) {
    if (!cliente || !cliente.connected) { log("No hay conexión"); return; }
    cliente.publish(TOPICO_CMD, cmd, { qos: 1 }, err => {
      log(err ? "Error al enviar: " + err.message : `Enviado: ${cmd}`);
    });
  }

  // ---- Medición de latencia: app → broker → ESP32 → broker → app ----
  const pings = new Map();
  let tiempos = [];

  function mostrarLatencia() {
    if (!tiempos.length) return;
    const prom = Math.round(tiempos.reduce((a, b) => a + b, 0) / tiempos.length);
    $("txtLatencia").textContent =
      `Promedio ${prom} ms · mínimo ${Math.min(...tiempos)} ms · máximo ${Math.max(...tiempos)} ms (${tiempos.length} pruebas)`;
  }

  $("btnLatencia").onclick = async () => {
    if (!cliente || !cliente.connected) { log("No hay conexión"); return; }
    tiempos = [];
    $("txtLatencia").textContent = "Midiendo…";
    for (let i = 0; i < 5; i++) {
      const id = Date.now() % 1000000000 + i;
      pings.set(id, performance.now());
      cliente.publish(TOPICO_CMD, "PING:" + id, { qos: 1 });
      await new Promise(r => setTimeout(r, 800));
    }
    if (!tiempos.length) $("txtLatencia").textContent = "La caja no respondió: ¿está conectada?";
  };

  $("btnIniciar").onclick = () => enviar("INICIAR:" + minutosElegidos);
  $("btnTerminar").onclick = () => enviar("TERMINAR");

  // Buzzer 3 s: el botón se bloquea mientras suena para no mandar órdenes repetidas
  $("btnBuzzer").onclick = () => {
    enviar("BUZZER");
    $("btnBuzzer").disabled = true;
    setTimeout(() => { $("btnBuzzer").disabled = false; }, 3000);
  };

  $("btnSalir").onclick = () => {
    if (cliente) cliente.end(true);
    cliente = null;
    estado = null;
    $("panel").classList.add("oculto");
    $("login").classList.remove("oculto");
    $("btnConectar").disabled = false;
  };
</script>
</body>
</html>
